[project]
name = "ygo-ultime-deck"
version = "0.1.0"
description = "Moteur d'optimisation de deck Yu-Gi-Oh!"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
    "typer>=0.26.7",
]

[project.scripts]
ygo-deck = "ygo_ultime_deck.main:app"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.16",
]
